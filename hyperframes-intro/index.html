<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0b0d;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #root {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 120% at 50% 30%, #14161b 0%, #0a0b0d 60%, #050507 100%);
      }

      /* Soft animated accent glow behind the logo */
      #glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 900px;
        height: 900px;
        margin: -450px 0 0 -450px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(204, 255, 0, 0.22) 0%, rgba(204, 255, 0, 0) 65%);
        filter: blur(8px);
      }

      /* Faint grid for an "IDE / engineering" feel */
      #grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 70%);
      }

      .center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        white-space: nowrap;
      }

      /* The juice droplet mark */
      #mark {
        top: 250px;
      }
      #droplet {
        width: 168px;
        height: 168px;
        margin: 0 auto;
        position: relative;
      }
      #droplet svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 18px 40px rgba(204, 255, 0, 0.35));
      }

      #wordmark {
        top: 470px;
        font-size: 132px;
        font-weight: 800;
        letter-spacing: -4px;
        color: #ffffff;
        line-height: 1;
      }
      #wordmark .accent {
        color: #ccff00;
      }

      #tagline {
        top: 640px;
        font-size: 40px;
        font-weight: 500;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.55);
      }

      /* Accent underline that wipes in under the wordmark */
      #rule {
        top: 628px;
        width: 520px;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(90deg, transparent, #ccff00, transparent);
        transform-origin: center;
      }

      /* Closing chip */
      #chip {
        top: 800px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 4px;
        color: #0a0b0d;
        background: #ccff00;
        padding: 16px 34px;
        border-radius: 999px;
        display: inline-block;
        box-shadow: 0 12px 30px rgba(204, 255, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="grid" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="glow" class="clip" data-start="0" data-duration="6" data-track-index="1"></div>

      <div id="mark" class="center clip" data-start="0" data-duration="6" data-track-index="2">
        <div id="droplet">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#e6ff66" />
                <stop offset="100%" stop-color="#a6cc00" />
              </linearGradient>
            </defs>
            <!-- droplet body -->
            <path
              d="M50 6 C50 6 86 50 86 70 A36 36 0 1 1 14 70 C14 50 50 6 50 6 Z"
              fill="url(#dropGrad)"
            />
            <!-- highlight -->
            <ellipse cx="38" cy="62" rx="9" ry="14" fill="rgba(255,255,255,0.45)" />
            <!-- leaf -->
            <path
              d="M50 6 C58 -2 74 0 78 8 C70 14 58 14 50 6 Z"
              fill="#7bd13a"
            />
          </svg>
        </div>
      </div>

      <h1 id="wordmark" class="center clip" data-start="0" data-duration="6" data-track-index="3">
        Apple<span class="accent">Juice</span>
      </h1>

      <div id="rule" class="center clip" data-start="0" data-duration="6" data-track-index="4"></div>

      <div id="tagline" class="center clip" data-start="0" data-duration="6" data-track-index="5">
        AI that ships Roblox code
      </div>

      <div id="chip" class="center clip" data-start="0" data-duration="6" data-track-index="6">
        apple-juice.online
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      // Initial states
      gsap.set("#glow", { scale: 0.4, opacity: 0 });
      gsap.set("#droplet", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#wordmark", { opacity: 0, y: 60 });
      gsap.set("#rule", { scaleX: 0 });
      gsap.set("#tagline", { opacity: 0, y: 24 });
      gsap.set("#chip", { opacity: 0, y: 30, scale: 0.9 });
      gsap.set("#grid", { opacity: 0 });

      // 0.0s — ambience fades up
      tl.to("#grid", { opacity: 1, duration: 1.2 }, 0);
      tl.to("#glow", { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0);

      // 0.3s — droplet pops in with an elastic settle
      tl.to(
        "#droplet",
        { scale: 1, opacity: 1, duration: 1.1, ease: "elastic.out(1, 0.55)" },
        0.3,
      );
      // gentle continuous bob
      tl.to("#droplet", { y: -14, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.4);

      // 0.9s — wordmark rises in
      tl.to("#wordmark", { opacity: 1, y: 0, duration: 0.9 }, 0.9);

      // 1.4s — accent rule wipes out from center
      tl.to("#rule", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 1.4);

      // 1.7s — tagline
      tl.to("#tagline", { opacity: 1, y: 0, duration: 0.8 }, 1.7);

      // 2.4s — CTA chip with a subtle pop
      tl.to("#chip", { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 2.4);

      // 4.6s — graceful exit (everything lifts and fades)
      tl.to(
        ["#wordmark", "#tagline", "#chip", "#droplet"],
        { opacity: 0, y: -40, duration: 0.8, stagger: 0.06, ease: "power2.in" },
        4.8,
      );
      tl.to(["#glow", "#grid", "#rule"], { opacity: 0, duration: 0.8 }, 4.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
